<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workout Plan</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f6f7fb;
        color: #1d1f23;
      }

      h1,
      h2,
      h3,
      h4,
      h5 {
        margin: 0;
      }

      .page {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        max-width: 720px;
        margin: 0 auto;
        padding: 8px;
      }

      #planSection {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .hero {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
      }

      .hero p {
        margin: 4px 0 0;
      }

      . {
        width: 100%;
        margin-top: 8px;
        padding: 12px 14px;
      }

      .hero p {
        margin: 8px 0 0;
        color: #4b5563;
        font-size: 0.95rem;
        line-height: 1.4;
      }

      .day-pill {
        display: inline-flex;
        gap: 8px;
        background: #eef2ff;
        color: #3730a3;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .next-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: none;
        border-radius: 999px;
        background: #4f46e5;
        color: #ffffff;
        padding: 12px 16px;
        font-size: 1rem;
        cursor: pointer;
      }

      .section {
        margin-top: 10px;
      }

      .section h2 {
        margin-bottom: 8px;
        font-size: 0.98rem;
      }

      .section h3 {
        display: none;
      }

      .exercise-list {
        display: grid;
        gap: 8px;
      }

      .exercise-card {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 16px;
        box-shadow: none;
      }

      .exercise-header {
        display: block;
        gap: 10px;
        align-items: flex-start;
      }

      .exercise-header h4 {
        font-size: 1.05rem;
      }

      .meta {
        color: #6b7280;
        font-size: 0.95rem;
      }

      .exercise-image {
        width: 100%;
        max-width: 260px;
        max-height: 170px;
        height: auto;
        border-radius: 12px;
        margin: 10px 0;
        object-fit: contain;
        border: 1px solid #e5e7eb;
        padding: 10px;
        background: #f8fafc;
      }

      .exercise-body p {
        margin: 0;
        line-height: 1.4;
        color: #374151;
        font-size: 0.92rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 0.95rem;
        color: #374151;
      }

      input,
      select {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 0.95rem;
        color: #111827;
        background: #ffffff;
      }

      input:focus,
      select:focus {
        outline: 2px solid #c7d2fe;
        outline-offset: 2px;
      }

      .hint {
        display: none;
      }

      @media (max-width: 720px) {
        .page {
          padding: 8px;
        }

        .exercise-card {
          padding: 14px;
        }

        .next-button {
          margin: 25px;
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <div class="day-pill" id="dayPill">DAY 1</div>
      </div>

      <section class="section" id="planSection"></section>
      <button class="next-button" id="nextBtn">Next exercise</button>
      <div class="hint"></div>
    </div>

    <script>

            muscles: ["Abs", "Obliques"],

      const planSection = document.getElementById("planSection");
      const dayPill = document.getElementById("dayPill");
      const nextBtn = document.getElementById("nextBtn");
      const introText = document.getElementById("introText");

      const state = loadState();

      function getAutoDayIndex() {
        const weekday = new Date().getDay();
        if (weekday === 0 || weekday === 6) return 0;
        if (weekday === 1 || weekday === 2) return 0;
        if (weekday === 3) return 1;
        if (weekday === 4 || weekday === 5) return 2;
        return 0;
      }

      function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        const autoDay = getAutoDayIndex();
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            return {
              selectedDay: autoDay,
              activeExerciseId: parsed.activeExerciseId,
              inputs: parsed.inputs || {}
            };
          } catch (err) {
            console.warn("Could not parse saved workout state", err);
          }
        }
        return {
          selectedDay: autoDay,
          activeExerciseId: undefined,
          inputs: {}
        };
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function getSavedInput(dayId, itemId, field, fallback) {
        return ((state.inputs[dayId] || {})[itemId] || {})[field] ?? fallback;
      }

      function getAllExerciseIdsForDay(dayIndex) {
        return planDays[dayIndex].sections.flatMap((section) => section.items.map((item) => item.id));
      }

      function getActiveExerciseIdForDay(dayIndex) {
        const allIds = getAllExerciseIdsForDay(dayIndex);
        if (!state.activeExerciseId || !allIds.includes(state.activeExerciseId)) {
          return allIds[0];
        }
        return state.activeExerciseId;
      }

      function renderPlan() {
        const plan = planDays[state.selectedDay];
        const activeExerciseId = getActiveExerciseIdForDay(state.selectedDay);
        state.activeExerciseId = activeExerciseId;
        saveState();

        dayPill.textContent = plan.title;
        planSection.innerHTML = "";

        plan.sections.forEach((section) => {
          const containsActive = section.items.some((item) => item.id === activeExerciseId);
          if (!containsActive) {
            return;
          }
          const sectionEl = document.createElement("section");
          sectionEl.className = "section";
          sectionEl.innerHTML = `<h2>${section.title}</h2>`;

          const list = document.createElement("div");
          list.className = "exercise-list";

          section.items.forEach((item) => {
            const card = document.createElement("article");
            card.className = "exercise-card";
            if (item.id !== activeExerciseId) {
              card.style.display = "none";
            }

            const muscles = item.muscles.join(", ");
            const savedSets = getSavedInput(plan.id, item.id, "sets", item.defaultSets);
            const savedReps = getSavedInput(plan.id, item.id, "reps", item.defaultReps);
            const savedWeight = getSavedInput(plan.id, item.id, "weight", item.defaultWeight);

            const imageHtml = item.image
              ? `<img class="exercise-image" src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.style.display='none';" />`
              : `<div class="meta">No image available</div>`;

            card.innerHTML = `
              <div class="exercise-header">
                <div>
                  <h4>${item.title}</h4>
                </div>
              </div>
              ${imageHtml}
              <div class="exercise-body">
                <p><strong>Muscles worked:</strong> ${muscles}</p>
                <p>${item.description}</p>
              </div>
              <div class="form-grid">
                <label>
                  Sets
                  <input data-day="${plan.id}" data-item="${item.id}" data-field="sets" type="number" min="1" value="${savedSets}" />
                </label>
                <label>
                  Reps / Time
                  <input data-day="${plan.id}" data-item="${item.id}" data-field="reps" type="text" value="${savedReps}" />
                </label>
                <label>
                  Weight level / notes
                  <input data-day="${plan.id}" data-item="${item.id}" data-field="weight" type="text" value="${savedWeight}" />
                </label>
              </div>
            `;

            list.appendChild(card);
          });

          sectionEl.appendChild(list);
          planSection.appendChild(sectionEl);
        });

        attachInputListeners();
      }

      function attachInputListeners() {
        const inputs = document.querySelectorAll("input[data-day][data-item][data-field]");
        inputs.forEach((input) => {
          input.addEventListener("input", (event) => {
            const target = event.target;
            const dayId = target.dataset.day;
            const itemId = target.dataset.item;
            const field = target.dataset.field;
            const value = target.value;
            state.inputs[dayId] = state.inputs[dayId] || {};
            state.inputs[dayId][itemId] = state.inputs[dayId][itemId] || {};
            state.inputs[dayId][itemId][field] = value;
            saveState();
          });
        });
      }

      function goToNext() {
        const exerciseIds = getAllExerciseIdsForDay(state.selectedDay);
        const currentIndex = exerciseIds.indexOf(state.activeExerciseId);
        const nextIndex = (currentIndex + 1) % exerciseIds.length;
        state.activeExerciseId = exerciseIds[nextIndex];
        saveState();
        renderPlan();
      }

      nextBtn.addEventListener("click", goToNext);
      renderPlan();
    </script>
  </body>
</html>
